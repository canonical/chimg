[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimg"
version = "0.3.0"
description = "A tool to modify images and chroots based on configuration"
readme = "README.rst"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Thomas Bechtold", email = "thomasbechtold@jpberlin.de"},
    {name = "CPC", email = "cpc@groups.canonical.com"}
]
keywords = ["Ubuntu", "chroot", "image"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.7.4",
    "packaging>=24.2",
]

[project.optional-dependencies]
test = [
    "flake8",
    "black",
    "pytest",
    "coverage",
]
type = [
    "mypy",
    "types-pyyaml",
    "pytest",
]
doc = [
    "Sphinx",
    "autodoc-pydantic>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/canonical/chimg"
Repository = "https://github.com/canonical/chimg"

[project.scripts]
chimg = "chimg.cli:main"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "realchroot: run functional tests with real chroot directory (created with mmdebstrap)"
]
log_cli = true
log_cli_level = "INFO"
